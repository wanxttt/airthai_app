version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Primary PostgreSQL 16 Relational Persistence
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: airthai-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-airthai_staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-airthai_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airthai-staging-net

  # ----------------------------------------------------------------------------
  # 2. PgBouncer Connection Pooler (Transaction Mode)
  # ----------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:v1.22.1
    container_name: airthai-staging-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ../pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airthai-staging-net

  # ----------------------------------------------------------------------------
  # 3. Redis 7 High-Speed Cache & Rate Limiting Key-Value Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: airthai-staging-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "stagingredispassword"]
    volumes:
      - redis_staging_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "stagingredispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airthai-staging-net

  # ----------------------------------------------------------------------------
  # 4. AirthAI NestJS Backend Modular Monolith API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../../backend/api
      dockerfile: Dockerfile
    container_name: airthai-staging-backend
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      PORT: 3000
      API_PREFIX: /api/v1
      # Connect via PgBouncer transaction pooler with pgbouncer=true
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgrespassword@pgbouncer:6432/airthai_staging?schema=public&pgbouncer=true}
      # Direct PostgreSQL connection for DDL migrations (prisma migrate deploy)
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-postgresql://postgres:postgrespassword@postgres:5432/airthai_staging?schema=public}
      # Distributed Redis Cache & Rate Limiting
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-stagingredispassword}
      JWT_SECRET: ${JWT_SECRET:-staging_jwt_secret_must_be_at_least_32_characters_for_security}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-staging_jwt_refresh_secret_must_be_at_least_32_characters}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_staging_dummy}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_staging_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-rzp_test_staging_webhook_secret}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - airthai-staging-net

  # ----------------------------------------------------------------------------
  # 5. Nginx Reverse Proxy & Flutter Web Static File Server
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: airthai-staging-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../frontend/flutter_app/build/web:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    networks:
      - airthai-staging-net

volumes:
  postgres_staging_data:
    name: airthai_staging_postgres_data
  redis_staging_data:
    name: airthai_staging_redis_data

networks:
  airthai-staging-net:
    name: airthai_staging_network
    driver: bridge
